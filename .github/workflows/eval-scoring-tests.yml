name: Eval scoring tests

on:
  pull_request:
    paths:
      - '.github/scripts/eval-*.cjs'
      - '.github/workflows/weekly-eval-bet.yml'
      - '.github/workflows/eval-scoring-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/eval-*.cjs'
      - '.github/workflows/weekly-eval-bet.yml'
      - '.github/workflows/eval-scoring-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/eval-*.test.cjs
