name: Daily eval bet auto-score

on:
  schedule:
    - cron: '0 9 * * 1-4' # Monday through Thursday at 09:00 UTC
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number to evaluate (leave empty for oldest ready bet)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  models: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find ready bet
        id: find-bet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ inputs.issue_number }}"
          else
            ISSUE_NUMBER=$(gh issue list \
              --label "weekly-eval-bet" \
              --label "status:ready" \
              --state open \
              --json number,createdAt \
              --jq 'sort_by(.createdAt) | .[0].number')
          fi

          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "null" ]; then
            echo "No ready bets found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Fetch issue details
          gh issue view "$ISSUE_NUMBER" --json title,body > /tmp/issue.json
          TITLE=$(jq -r '.title' /tmp/issue.json)
          BODY=$(jq -r '.body' /tmp/issue.json)
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          # Generate week identifier and slug
          WEEK=$(date +%Y-W%V)
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "filename=${WEEK}_${SLUG}.md" >> "$GITHUB_OUTPUT"

      - name: Fetch target page
        if: steps.find-bet.outputs.skip == 'false'
        id: fetch-page
        run: |
          # Extract URL from issue body (first https:// link)
          URL=$(jq -r '.body' /tmp/issue.json | grep -oP 'https://[^\s)]+' | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          if [ -n "$URL" ]; then
            curl -sL "$URL" | head -c 50000 > /tmp/page-content.html
            # Also get text-only version
            curl -sL "$URL" | sed 's/<[^>]*>//g' | sed '/^\s*$/d' | head -c 10000 > /tmp/page-text.txt
          fi

      - name: Auto-score with Copilot
        if: steps.find-bet.outputs.skip == 'false'
        id: auto-score
        uses: actions/github-script@v7
        env:
          WEEK: ${{ steps.find-bet.outputs.week }}
          FILENAME: ${{ steps.find-bet.outputs.filename }}
          TARGET_URL: ${{ steps.fetch-page.outputs.url }}
        with:
          script: |
            const fs = require('fs');

            const issueJson = JSON.parse(fs.readFileSync('/tmp/issue.json', 'utf8'));
            const rubric = fs.readFileSync('skills/first-impression-craft-rubric.md', 'utf8');
            const pageText = fs.existsSync('/tmp/page-text.txt')
              ? fs.readFileSync('/tmp/page-text.txt', 'utf8')
              : 'Page content not available.';
            const pageHtml = fs.existsSync('/tmp/page-content.html')
              ? fs.readFileSync('/tmp/page-content.html', 'utf8').substring(0, 30000)
              : '';

            const prompt = `You are a design director evaluating a product page. You score with precision and write with clarity. No emdashes. Sentence case for headings.

            ## Your task

            Evaluate the following page against the rubric and the bet's suggested evaluation approach. Produce a complete, publication-ready markdown evaluation report.

            ## Rubric

            ${rubric}

            ## Bet details

            Title: ${issueJson.title}
            ${issueJson.body}

            ## Page content (text extracted from ${process.env.TARGET_URL})

            ${pageText}

            ## Page HTML (first 30KB for structure analysis)

            ${pageHtml.substring(0, 15000)}

            ## Instructions

            1. Score each rubric dimension 1-5 with one sentence explaining the score.
            2. If the bet specifies its own evaluation approach (e.g. heuristic review, judged evaluation), apply THAT method as the primary evaluation and use the craft rubric as a secondary lens.
            3. Include a weighted score table (coherence is 2x, max 35).
            4. End with: patterns worth borrowing, anti-patterns to avoid.
            5. Add a "Status: auto-scored" note at the bottom. This will be reviewed by a human on Friday.
            6. Format the output as a complete markdown file starting with a level-1 heading.
            7. Do not use emdashes. Use commas, colons, or periods instead.`;

            // Call GitHub Models API
            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'openai/gpt-4o',
                messages: [{ role: 'user', content: prompt }],
                max_tokens: 4000,
                temperature: 0.3
              })
            });

            if (!response.ok) {
              const err = await response.text();
              core.setFailed(`Models API error: ${response.status} ${err}`);
              return;
            }

            const result = await response.json();
            const evaluation = result.choices[0].message.content;

            // Append human review section
            const reviewSection = `

---

## Human review (Friday)

Check each dimension you agree with. Add a note if you'd adjust the score.

- [ ] Visual hierarchy — 
- [ ] Information density — 
- [ ] Readability — 
- [ ] Coherence (2x) — 
- [ ] Durability — 
- [ ] Intentionality — 

**Overrides:** (adjust scores here if any dimension is off)


**Verdict confirmed?** [ ] Yes / [ ] Needs revision

---

*Status: auto-scored, pending human review*
`;

            fs.writeFileSync(`weekly-eval-bets/${process.env.FILENAME}`, evaluation + reviewSection);
            core.setOutput('evaluation', 'complete');
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        if: steps.find-bet.outputs.skip == 'false'
        env:
          FILENAME: ${{ steps.find-bet.outputs.filename }}
          ISSUE_NUMBER: ${{ steps.find-bet.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "weekly-eval-bets/$FILENAME"
          git commit -m "Auto-score eval bet #$ISSUE_NUMBER

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" || exit 0
          git push

      - name: Comment on issue
        if: steps.find-bet.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find-bet.outputs.issue_number }}
          FILENAME: ${{ steps.find-bet.outputs.filename }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Auto-scored evaluation committed to \`weekly-eval-bets/$FILENAME\`. Pending human review on Friday."
          gh issue edit "$ISSUE_NUMBER" --remove-label "status:ready" --add-label "status:reviewed"
